    <!-- Every section below is rendered by js/proposal-page.js from the

           #reasons        reasons for / against, % of the base that answered
           #design         design-preference distributions
           #criteria       design-preference distributions
           #evidence       evidence basis
           #quotes         curated quotes for / against
           #footnote       response bases for every question used
    -->
    <div class="content-wrap">
        <div id="proposalBody"></div>
    </div>

    <!-- ===== FOOTER (injected by shared-footer.js) ===== -->
    <footer id="siteFooter" data-footer-note="Scope 2 Public Consultation Response Explorer — Standard Supply Service"></footer>

    <!-- Page config: the only site-specific code on this page. -->
    <script>
    window.PROPOSAL_CONFIG = {
        "key": "sss",
        "lever": "sss_pro_rata_limit",
        "quoteLever": "sss",
        "panels": [
            {
                "kind": "note",
                "id": "intro",
                "variant": "insight-glass insight-glass-indigo",
                "html": "<strong>What the SSS guidance proposes.</strong> Where customers cannot choose their supplier, the electricity attributes embedded in the standard supply service would be allocated pro rata across the customers who receive it, rather than claimed in full by whoever reports first. The design questions below — who counts as a monopoly supplier, and what gets designated — matter more here than the headline stance, because opponents mostly object to unclear rules rather than to the principle."
            },
            {
                "kind": "stance",
                "q": 97,
                "html": "<strong>A genuinely mixed question.</strong> This is one of the proposals where the segments do not simply mirror the hourly-matching split — energy suppliers and utilities, the parties who would operate the pro-rata allocation, are among the least supportive."

                "for": 98,
                "against": 100
            },
            {

                "id": "design",
                "qs": [
                    107,
                    104
                ],
                "title": "Who counts, and should designation be automatic",
                "subtitle": "Q107 asks whether a default designation should exist; Q104 asks which supplier arrangements the definition should cover. Both keep &ldquo;Unsure&rdquo; visible as its own answer rather than dropping it."
            },
            {
                "kind": "selects",
                "id": "criteria",
                "qs": [
                    109
                ],
                "title": "Criteria for designating resources as standard supply",

            },
            {
                "kind": "evidence",

                "basis": null,
                "title": "What the answers rest on",
                "html": "<strong>No basis question hangs off the SSS guidance.</strong> The nearest evidence signal is the package-level basis question (Q138) on the <a href=\"package-impacts.html\">Package impacts page</a>. Every SSS elaboration is free text, so the arguments below are the primary record for this proposal."
            },
            {
                "kind": "quotes",
                "forTitle": "For the SSS guidance",
                "againstTitle": "Against the SSS guidance",
                "html": "Drawn from the SSS support and opposition elaborations and the general comment box on standard supply service."
            },
            {
                "kind": "footnote"
            }
        ]
    };
