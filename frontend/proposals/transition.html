<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition | Scope 2 Public Consultation Response Explorer</title>
    <meta name="description" content="Consultation answers on transition to the revised standard: preferred approach, the written-in effective dates with protest answers flagged, and verbatim arguments on both designs.">

    <!-- Fonts (design system: Plus Jakarta Sans headings, DM Sans body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/article.css">
    <link rel="stylesheet" href="../styles/cinematic.css">
    <link rel="stylesheet" href="../styles/site.css">

    <!-- GSAP for the cinematic scroll background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Chart.js (pinned). Plain script, never defer: js/chart-colors.js applies
         Chart defaults on DOMContentLoaded and no-ops if `Chart` is undefined. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- Design system modules -->
    <script src="../js/nav.js"></script>
    <script src="../js/chart-colors.js"></script>
    <script src="../js/shared-header.js"></script>
    <script src="../js/scroll-observer.js"></script>
    <script src="../js/shared-footer.js"></script>

    <!-- Site modules (data contract in plans/mbm-dashboard/PLAN.md §5) -->
    <script src="../js/data-loader.js"></script>
    <script src="../js/segments.js"></script>
    <script src="../js/likert-viz.js"></script>
    <script src="../js/quote-cards.js"></script>
    <script src="../js/org-table.js"></script>
</head>
<body>

    <!-- Navigation is injected by js/nav.js -->

    <!-- ===== BANNER (animated overlay injected by shared-header.js) ===== -->
    <header class="header" id="pageHeader">
        <h1>Transition</h1>
        <div class="subtitle">How the revised standard would come into force: a legacy clause, or one uniform effective date for everyone.</div>
        <div class="header-accent"></div>
    </header>

    <!-- Every section below is rendered by js/proposal-page.js from the
         PROPOSAL_CONFIG at the foot of this file. Panels, in order:
           #intro          page intro
           #approach       design-preference distributions
           #years          written-in year histogram, protest answers flagged
           #quotes         curated quotes for / against
           #evidence       evidence basis
           #footnote       response bases for every question used
    -->
    <div class="content-wrap">
        <div id="proposalBody"></div>
    </div>

    <!-- ===== FOOTER (injected by shared-footer.js) ===== -->
    <footer id="siteFooter" data-footer-note="Scope 2 Public Consultation Response Explorer — Transition"></footer>

    <!-- Page config: the only site-specific code on this page. -->
    <script>
    window.PROPOSAL_CONFIG = {
        "key": "transition",
        "lever": "transition_approach",
        "quoteLever": "transition",
        "panels": [
            {
                "kind": "note",
                "id": "intro",
                "variant": "insight-glass insight-glass-indigo",
                "html": "<strong>Two designs, one choice.</strong> Either existing contracts keep their current treatment (a legacy clause, the subject of the <a href=\"legacy-clause.html\">legacy-clause page</a>), or the revised criteria apply to everything from a single date after a lead time, with disaggregated disclosure for older contracts. Respondents were asked to pick, and then to name a year if the uniform date were chosen. There is no scored support question on this lever, so this page has no stance chart — the preference distribution below is the headline."
            },
            {
                "kind": "selects",
                "id": "approach",
                "qs": [
                    181
                ],
                "title": "Preferred transition approach",
                "subtitle": "Single choice between the legacy clause, a uniform effective date, and a written-in alternative.",
                "stats": [
                    {
                        "q": 181,
                        "match": "Legacy clause: allow existing contracts that meet current quality criteria to continue to be reported under the MBM as described in Question 178.",
                        "label": "prefer a legacy clause",
                        "tint": "text-wind"
                    },
                    {
                        "q": 181,
                        "match": "Uniform effective date: rather than using a legacy clause, instead apply the updated quality criteria to all contractual instruments from a specific date following a defined lead time. Include a separate disclosure that disaggregates results affected by contracts signed prior to this date.",
                        "label": "prefer a uniform effective date",
                        "tint": "text-muted"
                    },
                    {
                        "q": 181,
                        "match": "Other (please specify)",
                        "label": "wrote in a different approach",
                        "tint": "text-muted"
                    }
                ],
                "html": "<strong>The option texts are long because the survey&rsquo;s were.</strong> Both are reproduced as written rather than paraphrased; hover a bar for the full text and the count. Respondents who chose &ldquo;other&rdquo; explained themselves in free text (Q182), which is where the quotes below come from."
            },
            {
                "kind": "years",
                "q": 183,
                "title": "If there were a uniform effective date, which year"
            },
            {
                "kind": "quotes",
                "forTitle": "For a legacy-clause transition",
                "againstTitle": "For a uniform effective date",
                "html": "<strong>How to read these two columns.</strong> The curation sides are relative to the legacy-clause approach, which is the proposal on the table: the left column argues against a uniform effective date, the right argues for one. Both sets come from the same free-text question (Q182), so they are directly comparable arguments rather than two different populations."
            },
            {
                "kind": "evidence",
                "id": "evidence",
                "basis": null,
                "title": "What the answers rest on",
                "html": "<strong>No basis question hangs off the transition.</strong> The nearest quantitative anchors are the legacy-clause stance on the <a href=\"legacy-clause.html\">legacy-clause page</a> and the package-level evidence basis on the <a href=\"package-impacts.html\">Package impacts page</a>."
            },
            {
                "kind": "footnote"
            }
        ]
    };
    </script>
    <script src="../js/proposal-page.js"></script>

    <!-- Cinematic parallax background (must load after body content) -->
    <script src="../js/cinematic-bg.js"></script>
</body>
</html>
