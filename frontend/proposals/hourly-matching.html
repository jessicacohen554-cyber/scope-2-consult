           #reasons        reasons for / against, % of the base that answered
           #burden         scale rows (construct-aware ramp) + driver picklists
           #scope          design-preference distributions
           #evidence       evidence basis
           #quotes         curated quotes for / against
           #footnote       response bases for every question used
    -->
    <div class="content-wrap">
        <div id="proposalBody"></div>
    </div>

    <!-- ===== FOOTER (injected by shared-footer.js) ===== -->
    <footer id="siteFooter" data-footer-note="Scope 2 Public Consultation Response Explorer — Hourly Matching — QC4"></footer>
