</head>
<body>

    <!-- Navigation is injected by js/nav.js -->

    <!-- ===== BANNER (animated overlay injected by shared-header.js) ===== -->
    <header class="header" id="pageHeader">
        <h1>Legacy clause</h1>
        <div class="subtitle">Letting contracts signed under today&rsquo;s rules keep being reported under today&rsquo;s rules — the tightest consensus in the consultation.</div>
        <div class="header-accent"></div>
    </header>

    <!-- Every section below is rendered by js/proposal-page.js from the
         PROPOSAL_CONFIG at the foot of this file. Panels, in order:
           #intro          page intro
           #stance         stance — diverging bar + segment toggle + redaction split
           #reasons        reasons for / against, % of the base that answered
           #eligibility    design-preference distributions
           #impact         scale rows (construct-aware ramp) + driver picklists
           #quotes         curated quotes for / against
           #evidence       evidence basis
           #footnote       response bases for every question used
    -->
    <div class="content-wrap">
        <div id="proposalBody"></div>
    </div>

    <!-- ===== FOOTER (injected by shared-footer.js) ===== -->
    <footer id="siteFooter" data-footer-note="Scope 2 Public Consultation Response Explorer — Legacy Clause"></footer>

    <!-- Page config: the only site-specific code on this page. -->
    <script>
    window.PROPOSAL_CONFIG = {
        "key": "legacy-clause",
        "lever": "legacy_clause",
        "quoteLever": "legacy_clause",
        "panels": [
            {
                "kind": "note",
                "id": "intro",
                "variant": "insight-glass insight-glass-indigo",
                "html": "<strong>What the legacy clause does.</strong> Contracts already signed under the 2015 guidance would continue to be reportable under the market-based method even if they fail the new quality criteria. It is the most supported proposal in the consultation, and the only one where redacted respondents are <em>more</em> supportive than named ones — the reverse of every other anchor on this site."
            },
            {
                "kind": "stance",
                "q": 171,
                "html": "<strong>Watch the redaction panel on this page.</strong> On every other proposal, anonymity comes with more opposition. Here it does not, which is worth knowing before treating attributable answers as the conservative read."
            },
            {
                "kind": "reasons",
                "for": 172,
                "against": 174,
                "html": "<strong>The candid reason.</strong> &ldquo;Protects committed investments&rdquo; and &ldquo;early-adopter equity&rdquo; are near the top of the support list — respondents are explicit that this clause protects claims they have already paid for. The opposition base is the smallest of any reasons question on the site, so read its percentages against that base, not against the support column."
            },
            {
                "kind": "selects",
                "id": "eligibility",
                "qs": [
                    176
                ],
                "title": "Which date should decide eligibility",
                "subtitle": "Whether a contract qualifies by its signature date relative to publication or to implementation of the revised standard.",
                "stats": [
                    {
                        "q": 176,
                        "match": "Contract signed prior to implementation date of the Scope 2 Standard (post phase-in period)",
                        "label": "want the implementation date to govern",
                        "tint": "text-wind"
                    },
                    {
                        "q": 176,
                        "match": "Contract signed prior to publication date of the Scope 2 Standard",
                        "label": "want the publication date to govern",
                        "tint": "text-muted"
                    },
                    {
                        "q": 176,
                        "match": "Do not support Legacy Clause",
                        "label": "do not support a legacy clause",
                        "tint": "text-storage"
                    }
                ],
                "html": "<strong>The later date wins comfortably.</strong> Choosing implementation over publication extends the window in which a qualifying contract can still be signed — the difference between the two options is a phase-in period&rsquo;s worth of new contracts."
            },
            {
                "kind": "scale",
                "id": "impact",
                "qs": [
                    179
                ],
                "title": "Knock-on effect on financial-risk disclosure",
                "chartTitle": "Implications for climate-related financial disclosure",
                "html": "<strong>Not a support scale.</strong> Q179 measures how large respondents think the implications are for users of climate-related financial disclosures — a magnitude, where 5 means &ldquo;high implications&rdquo; and says nothing about whether the respondent wants the clause. It is answered by a much smaller group than the stance question above."
            },
            {
                "kind": "quotes",
                "forTitle": "For the legacy clause",
                "againstTitle": "Against the legacy clause",
                "html": "Includes the design-element comments (Q178) and the general legacy-clause comment box (Q180). The opposition side is thinner than elsewhere on the site because far fewer respondents took the against position at all."
            },
            {
                "kind": "evidence",
                "id": "evidence",
                "basis": null,
                "title": "What the answers rest on",
                "html": "<strong>No basis question hangs off the legacy clause.</strong> The package-level basis distribution is on the <a href=\"package-impacts.html\">Package impacts page</a>, and the transition mechanics — legacy clause versus a uniform effective date — are on the <a href=\"transition.html\">Transition page</a>."
            },
            {
                "kind": "footnote"
            }
        ]
    };
    </script>
    <script src="../js/proposal-page.js"></script>

    <!-- Cinematic parallax background (must load after body content) -->
    <script src="../js/cinematic-bg.js"></script>
